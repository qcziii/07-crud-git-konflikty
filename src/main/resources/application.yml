spring:
  application:
    name: library
  datasource:
    url: jdbc:h2:mem:library
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true

server:
  port: 8080

library:
  loans:
    limit-per-reader: 3
